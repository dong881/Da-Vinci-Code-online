<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Logic Test - Da Vinci Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: white;
        }
        .test-result.pass {
            border-left: 4px solid #4caf50;
        }
        .test-result.fail {
            border-left: 4px solid #f44336;
        }
        h1 {
            color: #667eea;
        }
        .summary {
            padding: 20px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>🧪 Da Vinci Code - Game Logic Tests</h1>
    <div id="test-results"></div>
    <div id="summary" class="summary"></div>

    <script src="game.js"></script>
    <script>
        const resultsDiv = document.getElementById('test-results');
        const summaryDiv = document.getElementById('summary');
        let passCount = 0;
        let failCount = 0;

        function addResult(testName, passed, message = '') {
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.innerHTML = `
                <strong>${passed ? '✅' : '❌'} ${testName}</strong>
                ${message ? `<br><small>${message}</small>` : ''}
            `;
            resultsDiv.appendChild(div);
            
            if (passed) passCount++;
            else failCount++;
        }

        // Run all tests
        try {
            // Test 1: Game Initialization
            const game = new DaVinciGame();
            game.initGame(['Alice', 'Bob']);
            addResult(
                'Game Initialization',
                game.players.length === 2 && game.players[0].hand.length === 4,
                'Players and initial hands created correctly'
            );

            // Test 2: Hand Sorting
            let allSorted = true;
            for (let player of game.players) {
                for (let i = 1; i < player.hand.length; i++) {
                    const prev = player.hand[i-1];
                    const curr = player.hand[i];
                    if (prev.number > curr.number || 
                        (prev.number === curr.number && prev.color === 'white' && curr.color === 'black')) {
                        allSorted = false;
                        break;
                    }
                }
            }
            addResult('Hand Sorting', allSorted, 'All player hands are sorted correctly');

            // Test 3: Current Player
            const currentPlayer = game.getCurrentPlayer();
            addResult(
                'Current Player Tracking',
                currentPlayer && currentPlayer.id === 0,
                `Current player: ${currentPlayer.name}`
            );

            // Test 4: Game State
            const state = game.getGameState();
            addResult(
                'Game State Generation',
                state.players && state.currentPlayerIndex !== undefined && state.deckCounts,
                'Complete game state with all required fields'
            );

            // Test 5: Player-Specific State
            const playerState = game.getGameStateForPlayer(0);
            const hasHiddenTiles = playerState.players[1].hand.some(t => t.hidden);
            addResult(
                'Player-Specific State',
                hasHiddenTiles,
                'Opponent tiles are properly hidden'
            );

            // Test 6: Correct Guess
            const testGame2 = new DaVinciGame();
            testGame2.initGame(['P1', 'P2']);
            const targetTile = testGame2.players[1].hand[0];
            const result = testGame2.processGuess(0, 1, 0, targetTile.number);
            addResult(
                'Correct Guess Processing',
                result.success && result.correct && targetTile.revealed,
                'Tile revealed on correct guess'
            );

            // Test 7: Wrong Guess
            const testGame3 = new DaVinciGame();
            testGame3.initGame(['P1', 'P2']);
            const wrongNum = (testGame3.players[1].hand[0].number + 5) % 12;
            const result2 = testGame3.processGuess(0, 1, 0, wrongNum);
            addResult(
                'Wrong Guess Processing',
                result2.success && !result2.correct && testGame3.players[0].hand.some(t => t.revealed),
                'Guesser\'s tile revealed on wrong guess'
            );

            // Test 8: Turn Progression
            const testGame4 = new DaVinciGame();
            testGame4.initGame(['P1', 'P2', 'P3']);
            const initialPlayer = testGame4.currentPlayerIndex;
            testGame4.nextTurn();
            addResult(
                'Turn Progression',
                testGame4.currentPlayerIndex === (initialPlayer + 1) % 3,
                'Turn advances to next player'
            );

            // Test 9: Elimination Check
            const testGame5 = new DaVinciGame();
            testGame5.initGame(['P1', 'P2']);
            testGame5.players[1].hand.forEach(t => t.revealed = true);
            testGame5.players[1].eliminated = true;
            const nextPlayer = testGame5.getNextPlayer();
            addResult(
                'Player Elimination',
                nextPlayer.id !== 1,
                'Eliminated players are skipped'
            );

            // Test 10: Winner Determination
            const testGame6 = new DaVinciGame();
            testGame6.initGame(['Winner', 'Loser']);
            testGame6.players[1].hand.forEach(t => t.revealed = true);
            testGame6.players[1].eliminated = true;
            testGame6.gameState = 'finished';
            const winner = testGame6.getWinner();
            addResult(
                'Winner Determination',
                winner && winner.name === 'Winner',
                `Winner correctly identified: ${winner.name}`
            );

        } catch (error) {
            addResult('Test Execution', false, `Error: ${error.message}`);
            failCount++;
        }

        // Display summary
        const total = passCount + failCount;
        summaryDiv.innerHTML = `
            <strong>Test Results:</strong><br>
            ${passCount}/${total} tests passed
            ${failCount > 0 ? `<br>⚠️ ${failCount} test(s) failed` : '<br>🎉 All tests passed!'}
        `;
    </script>
</body>
</html>
